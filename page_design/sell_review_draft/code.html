<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Draft Review</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Outfit:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#ffdad4",
                        "surface-tint": "#9a442d",
                        "text-main": "#3D405B",
                        "surface-container-highest": "#dfe0ff",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "background": "#fbf8ff",
                        "border-subtle": "#E2E8F0",
                        "on-secondary-container": "#795c57",
                        "surface-variant": "#dfe0ff",
                        "secondary-fixed-dim": "#e3beb8",
                        "secondary-container": "#fed7d0",
                        "surface-container-high": "#e6e6ff",
                        "on-background": "#161a32",
                        "secondary": "#745853",
                        "tertiary": "#006b5b",
                        "on-surface": "#161a32",
                        "tertiary-fixed-dim": "#5edbc1",
                        "on-tertiary-container": "#00362d",
                        "outline": "#88726d",
                        "on-error": "#ffffff",
                        "primary-fixed": "#ffdbd2",
                        "on-primary": "#ffffff",
                        "text-secondary": "#6B7280",
                        "on-secondary": "#ffffff",
                        "surface-card": "#FFFFFF",
                        "primary-fixed-dim": "#ffb4a1",
                        "surface-dim": "#d6d8f9",
                        "inverse-on-surface": "#f1efff",
                        "surface-muted": "#F4F3F0",
                        "outline-variant": "#dbc1ba",
                        "surface-container-low": "#f4f2ff",
                        "on-surface-variant": "#55423e",
                        "status-error": "#E63946",
                        "on-primary-fixed-variant": "#7c2e19",
                        "on-primary-container": "#5b1604",
                        "surface-bright": "#fbf8ff",
                        "error": "#ba1a1a",
                        "primary-container": "#e07a5f",
                        "app-bg": "#FAF9F6",
                        "surface": "#fbf8ff",
                        "primary": "#9a442d",
                        "on-secondary-fixed": "#2b1613",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#00201a",
                        "surface-container": "#edecff",
                        "status-success": "#81B29A",
                        "inverse-surface": "#2b2e48",
                        "on-secondary-fixed-variant": "#5b403c",
                        "tertiary-fixed": "#7df7dd",
                        "inverse-primary": "#ffb4a1",
                        "tertiary-container": "#19a992",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#3c0800",
                        "on-tertiary-fixed-variant": "#005144"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "xl": "32px",
                        "md": "16px",
                        "xs": "8px",
                        "lg": "24px",
                        "sm": "12px",
                        "margin-desktop": "48px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "display-lg": ["Outfit"],
                        "title-card": ["Manrope"],
                        "body-main": ["Manrope"],
                        "body-sm": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "headline-md": ["Outfit"],
                        "display-lg-mobile": ["Outfit"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "title-card": ["18px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "body-main": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}]

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-app-bg text-on-surface antialiased min-h-screen flex flex-col font-body-main">
<!-- TopAppBar -->
<header class="bg-background text-primary font-display-lg text-headline-md docked full-width top-0 border-b border-border-subtle flat no shadows flex justify-between items-center px-4 h-16 w-full max-w-7xl mx-auto sticky z-50">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-display-lg text-headline-md font-bold text-primary">Sell Item</h1>
<button class="text-on-surface-variant font-body-sm hover:opacity-80 transition-opacity active:scale-95 focus:outline-none">
            Drafts
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-lg pb-32">
<div class="max-w-md mx-auto space-y-lg">
<!-- Header Section -->
<div class="text-center space-y-sm">
<h2 class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight">Review draft</h2>
<p class="font-body-sm text-body-sm text-text-secondary">We've pre-filled details based on your photo.</p>
</div>
<!-- Image Preview Card -->
<div class="bg-surface-card border border-border-subtle rounded-xl p-md flex items-center space-x-md">
<div class="w-20 h-20 bg-surface-muted rounded-lg overflow-hidden flex-shrink-0 relative">
<img alt="Vintage Wooden Desk Chair Preview" class="w-full h-full object-cover" data-alt="A small, square close-up photo of a vintage wooden desk chair with a warm, reddish-brown stain. The chair features curved armrests and vertical spindle back supports typical of mid-century modern design. It is photographed against a clean, plain white background under bright, even studio lighting that highlights the wood grain. The image is cropped tightly, serving as a clean product preview thumbnail." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYPNQzsVJXaRsTyKDiq9KlxYJ9MiyKmVAvLBx9OWfnJ7HE_JLfxdMe9EKgCVXGeTiTTlU72RFXkDHFydJrMKDSKwpiJXUsCxNuFdjMYx5hpNjJtDHL0pGRWaQ-LEr-sKaKQAkhMeBgUl7VncxF0oRlOF-NHCC9A9zx7fKw3jK9kOu-HI3-_Ax53-I6FZ5_RbfI872KvG2Vp_OQUAKDibm0xAlzERQdjCPfi6CvvgiQsBsclWsfmHSBTx7OuhHyd_zs0oeF6BnCTr8"/>
<button class="absolute top-1 right-1 bg-inverse-surface/50 rounded-full p-1 text-on-primary hover:bg-inverse-surface/80 transition-colors focus:outline-none">
<span aria-hidden="true" class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
<div class="flex-grow">
<p class="font-title-card text-title-card text-on-surface line-clamp-2">Vintage Wooden Desk Chair</p>
</div>
</div>
<!-- Form Fields -->
<form class="space-y-md">
<!-- Title Input -->
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="item-title">Title</label>
<input class="w-full bg-surface-card border border-border-subtle rounded-lg px-4 py-3 font-body-main text-body-main text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="item-title" type="text" value="Vintage Wooden Desk Chair"/>
</div>
<!-- Description Textarea -->
<div class="space-y-xs">
<div class="flex justify-between items-baseline">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="item-description">Description</label>
<span class="font-body-sm text-xs text-text-secondary">AI Suggested</span>
</div>
<textarea class="w-full bg-surface-card border border-border-subtle rounded-lg px-4 py-3 font-body-main text-body-main text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all resize-none" id="item-description" rows="4">Mid-century style solid wood desk chair in excellent condition. Features a contoured seat and curved backrest for ergonomic support. The warm wood tone complements a variety of interior styles. Shows minimal signs of wear consistent with careful use.</textarea>
</div>
<div class="grid grid-cols-2 gap-md">
<!-- Category Dropdown -->
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="item-category">Category</label>
<div class="relative">
<select class="appearance-none w-full bg-surface-card border border-border-subtle rounded-lg pl-4 pr-10 py-3 font-body-main text-body-main text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="item-category">
<option selected="" value="furniture">Furniture</option>
<option value="decor">Decor</option>
<option value="electronics">Electronics</option>
<option value="clothing">Clothing</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Condition Dropdown -->
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="item-condition">Condition</label>
<div class="relative">
<select class="appearance-none w-full bg-surface-card border border-border-subtle rounded-lg pl-4 pr-10 py-3 font-body-main text-body-main text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="item-condition">
<option value="new">New</option>
<option value="like-new">Like New</option>
<option selected="" value="good">Good</option>
<option value="fair">Fair</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</div>
</form>
</div>
</main>
<!-- Bottom Action Bar (Contextual FAB Replacement for Transactional Flow) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-border-subtle p-margin-mobile pb-safe z-40">
<div class="max-w-md mx-auto flex gap-sm">
<button class="flex-1 bg-surface-card border border-outline text-text-main font-title-card text-title-card py-3 rounded-lg hover:bg-surface-muted transition-colors active:scale-95 focus:outline-none focus:ring-2 focus:ring-outline focus:ring-offset-2" type="button">
                Save Draft
            </button>
<button class="flex-[2] bg-primary text-on-primary font-title-card text-title-card py-3 rounded-lg hover:bg-surface-tint transition-colors active:scale-95 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex justify-center items-center gap-2" type="button">
                Next to pricing
                <span aria-hidden="true" class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</body></html>
