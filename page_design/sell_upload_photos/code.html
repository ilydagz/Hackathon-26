<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-app-bg text-on-surface font-body-main min-h-screen flex flex-col relative w-full max-w-[390px] mx-auto overflow-hidden">
<!-- TopAppBar JSON Executed -->
<header class="bg-background dark:bg-on-background flex justify-between items-center px-4 h-16 w-full max-w-7xl mx-auto border-b border-border-subtle dark:border-outline-variant z-10 shrink-0">
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center w-10 h-10 -ml-2 rounded-full">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-display-lg text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Sell Item</h1>
<button class="text-on-surface-variant dark:text-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform font-title-card text-title-card px-2">Drafts</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile pt-lg pb-[120px] flex flex-col">
<!-- Header Text -->
<div class="mb-lg">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight mb-2">Add photos</h2>
<p class="font-body-main text-body-main text-on-surface-variant">Clear photos help our agent create a better draft for you.</p>
</div>
<!-- Photo Grid Area -->
<div class="grid grid-cols-2 gap-sm mb-md">
<!-- Slot 1: Primary Action (Camera) -->
<button class="col-span-2 aspect-video bg-primary-fixed/20 border-2 border-primary border-dashed rounded-xl flex flex-col items-center justify-center text-primary hover:bg-primary-fixed/30 active:scale-[0.98] transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined" style="font-size: 36px; font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-title-card text-title-card mt-sm">Take photo</span>
</button>
<!-- Slots 2-5: Empty Placeholders -->
<div class="aspect-square bg-surface-muted border border-border-subtle border-dashed rounded-xl flex items-center justify-center text-outline-variant relative overflow-hidden">
<span class="material-symbols-outlined text-outline">add_photo_alternate</span>
</div>
<div class="aspect-square bg-surface-muted border border-border-subtle border-dashed rounded-xl flex items-center justify-center text-outline-variant relative overflow-hidden">
<span class="material-symbols-outlined text-outline">add_photo_alternate</span>
</div>
<div class="aspect-square bg-surface-muted border border-border-subtle border-dashed rounded-xl flex items-center justify-center text-outline-variant relative overflow-hidden">
<span class="material-symbols-outlined text-outline">add_photo_alternate</span>
</div>
<div class="aspect-square bg-surface-muted border border-border-subtle border-dashed rounded-xl flex items-center justify-center text-outline-variant relative overflow-hidden">
<span class="material-symbols-outlined text-outline">add_photo_alternate</span>
</div>
</div>
<!-- Secondary Action -->
<button class="w-full flex items-center justify-center gap-xs py-sm text-primary font-title-card text-title-card hover:bg-primary-fixed/10 active:bg-primary-fixed/20 rounded-lg transition-colors">
<span class="material-symbols-outlined">collections</span>
            Upload from gallery
        </button>
</main>
<!-- Bottom Footer (Fixed) -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-border-subtle px-margin-mobile py-4 pb-8 z-20">
<button class="w-full bg-surface-muted text-text-secondary py-4 rounded-full font-title-card text-title-card text-center opacity-60 cursor-not-allowed" disabled="">
            Next
        </button>
</footer>
</body></html>
