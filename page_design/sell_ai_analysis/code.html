    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-app-bg text-on-background antialiased min-h-screen flex flex-col items-center justify-center">
<!-- Mobile Container -->
<main class="w-full max-w-[390px] h-[844px] bg-app-bg relative flex flex-col overflow-hidden shadow-2xl mx-auto sm:my-8 rounded-3xl">
<!-- Header -->
<header class="flex justify-between items-center px-4 h-16 w-full max-w-7xl mx-auto bg-background border-b border-border-subtle shrink-0">
<button class="text-primary hover:opacity-80 active:scale-95 p-2 rounded-full flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="font-display-lg text-headline-md font-bold text-primary">Sell Item</h1>
<button class="text-primary hover:opacity-80 active:scale-95 font-body-sm px-2 py-1 rounded transition-all">
                Drafts
            </button>
</header>
<!-- Main Content -->
<div class="flex-1 flex flex-col px-6 py-8 overflow-y-auto">
<div class="text-center mb-10">
<h2 class="font-display-lg-mobile text-display-lg-mobile mb-3">Creating your draft...</h2>
<p class="font-body-main text-body-main text-text-secondary">Our agent is analyzing your photos to save you time.</p>
</div>
<!-- Visual Progress -->
<div class="relative w-48 h-48 mx-auto mb-12 flex items-center justify-center">
<div class="absolute inset-0 rounded-full border-[12px] border-surface-container-high"></div>
<div class="absolute inset-0 rounded-full border-[12px] border-primary border-t-transparent border-l-transparent transform rotate-45"></div>
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<!-- Steps -->
<div class="space-y-6 max-w-xs mx-auto w-full">
<!-- Step 1 -->
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-status-success flex items-center justify-center text-on-primary shrink-0">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-body-main text-body-main">Identifying item</span>
</div>
<!-- Step 2 -->
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-status-success flex items-center justify-center text-on-primary shrink-0">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-body-main text-body-main">Assessing condition</span>
</div>
<!-- Step 3 -->
<div class="flex items-center gap-4 opacity-100">
<div class="w-8 h-8 rounded-full border-2 border-primary flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-[16px]">hourglass_bottom</span>
</div>
<span class="font-title-card text-title-card text-primary">Researching market prices...</span>
</div>
<!-- Step 4 -->
<div class="flex items-center gap-4 opacity-50">
<div class="w-8 h-8 rounded-full border-2 border-outline flex items-center justify-center text-outline shrink-0">
<span class="material-symbols-outlined text-[16px]">pending</span>
</div>
<span class="font-body-main text-body-main text-outline">Drafting description</span>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-6 shrink-0 mt-auto">
<button class="w-full py-4 rounded-lg border border-border-subtle bg-transparent text-text-main font-title-card text-title-card hover:bg-surface-muted transition-colors text-center">
                Cancel
            </button>
</div>
</main>
</body></html>
