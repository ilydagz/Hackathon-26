<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Pick a price</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#ffdad4",
                        "surface-tint": "#9a442d",
                        "text-main": "#3D405B",
                        "surface-container-highest": "#dfe0ff",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "background": "#fbf8ff",
                        "border-subtle": "#E2E8F0",
                        "on-secondary-container": "#795c57",
                        "surface-variant": "#dfe0ff",
                        "secondary-fixed-dim": "#e3beb8",
                        "secondary-container": "#fed7d0",
                        "surface-container-high": "#e6e6ff",
                        "on-background": "#161a32",
                        "secondary": "#745853",
                        "tertiary": "#006b5b",
                        "on-surface": "#161a32",
                        "tertiary-fixed-dim": "#5edbc1",
                        "on-tertiary-container": "#00362d",
                        "outline": "#88726d",
                        "on-error": "#ffffff",
                        "primary-fixed": "#ffdbd2",
                        "on-primary": "#ffffff",
                        "text-secondary": "#6B7280",
                        "on-secondary": "#ffffff",
                        "surface-card": "#FFFFFF",
                        "primary-fixed-dim": "#ffb4a1",
                        "surface-dim": "#d6d8f9",
                        "inverse-on-surface": "#f1efff",
                        "surface-muted": "#F4F3F0",
                        "outline-variant": "#dbc1ba",
                        "surface-container-low": "#f4f2ff",
                        "on-surface-variant": "#55423e",
                        "status-error": "#E63946",
                        "on-primary-fixed-variant": "#7c2e19",
                        "on-primary-container": "#5b1604",
                        "surface-bright": "#fbf8ff",
                        "error": "#ba1a1a",
                        "primary-container": "#e07a5f",
                        "app-bg": "#FAF9F6",
                        "surface": "#fbf8ff",
                        "primary": "#9a442d",
                        "on-secondary-fixed": "#2b1613",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#00201a",
                        "surface-container": "#edecff",
                        "status-success": "#81B29A",
                        "inverse-surface": "#2b2e48",
                        "on-secondary-fixed-variant": "#5b403c",
                        "tertiary-fixed": "#7df7dd",
                        "inverse-primary": "#ffb4a1",
                        "tertiary-container": "#19a992",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#3c0800",
                        "on-tertiary-fixed-variant": "#005144"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "xl": "32px",
                        "md": "16px",
                        "xs": "8px",
                        "lg": "24px",
                        "sm": "12px",
                        "margin-desktop": "48px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "display-lg": ["Outfit"],
                        "title-card": ["Manrope"],
                        "body-main": ["Manrope"],
                        "body-sm": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "headline-md": ["Outfit"],
                        "display-lg-mobile": ["Outfit"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "title-card": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-main": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #FAF9F6; } /* Fallback to app-bg */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-app-bg text-on-background font-body-main antialiased min-h-screen flex flex-col w-full max-w-[390px] mx-auto relative overflow-x-hidden">
<!-- TopAppBar Component from JSON -->
<header class="flex justify-between items-center px-4 h-16 w-full max-w-7xl mx-auto bg-background dark:bg-on-background text-primary dark:text-primary-fixed-dim font-display-lg text-headline-md docked full-width top-0 border-b border-border-subtle dark:border-outline-variant flat no shadows sticky z-50">
<button aria-label="Close" class="flex items-center justify-center p-2 rounded-full hover:opacity-80 transition-opacity active:scale-95 transition-transform text-on-surface-variant dark:text-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-display-lg text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Sell Item</h1>
<button class="flex items-center justify-center px-4 py-2 rounded-full hover:opacity-80 transition-opacity active:scale-95 transition-transform text-primary font-bold">
            Drafts
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-lg pb-32 flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col gap-sm">
<span class="font-label-caps text-label-caps text-text-secondary tracking-widest uppercase">Step 4 of 4</span>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Pick a price</h2>
</div>
<!-- AI Rationale Banner -->
<div class="bg-surface-container-low border border-border-subtle rounded-lg p-md flex items-start gap-sm">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<div class="flex flex-col gap-base">
<p class="font-body-sm text-body-sm text-on-surface">Based on 14 similar listings in your area, pricing slightly lower helps it move fast.</p>
</div>
</div>
<!-- Pricing Options Grid -->
<div class="flex flex-col gap-md">
<!-- Quick Sale Option (Selected state) -->
<label class="relative flex flex-col gap-sm p-md rounded-xl border-2 border-primary bg-surface-card cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-title-card text-title-card text-primary">Quick Sale</span>
</div>
<input checked="" class="sr-only" name="price_selection" type="radio" value="quick"/>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>
</div>
<div class="flex flex-col gap-base">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface">850 TL</span>
<span class="font-body-sm text-body-sm text-text-secondary">Sells in 1-2 days based on similar listings.</span>
</div>
<!-- Highlight Badge -->
<div class="absolute -top-3 -right-2 bg-primary text-on-primary font-label-caps text-label-caps px-3 py-1 rounded-full shadow-sm">
                    RECOMMENDED
                </div>
</label>
<!-- Market Price Option -->
<label class="relative flex flex-col gap-sm p-md rounded-xl border border-border-subtle bg-surface-card cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-text-secondary" style="font-variation-settings: 'FILL' 0;">storefront</span>
<span class="font-title-card text-title-card text-on-surface">Market Price</span>
</div>
<input class="sr-only" name="price_selection" type="radio" value="market"/>
<div class="w-6 h-6 rounded-full border-2 border-border-subtle flex items-center justify-center">
</div>
</div>
<div class="flex flex-col gap-base">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface">1,100 TL</span>
<span class="font-body-sm text-body-sm text-text-secondary">Standard price, might take 1 week to sell.</span>
</div>
</label>
<!-- Custom Price Option -->
<div class="relative flex flex-col gap-sm p-md rounded-xl border border-border-subtle bg-surface-card">
<div class="flex justify-between items-center w-full mb-sm">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-text-secondary" style="font-variation-settings: 'FILL' 0;">edit</span>
<span class="font-title-card text-title-card text-on-surface">Custom Price</span>
</div>
</div>
<div class="relative flex items-center">
<input class="w-full bg-surface-muted border border-border-subtle rounded-lg py-3 px-4 font-body-main text-body-main text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-12" placeholder="Enter amount" type="number"/>
<span class="absolute right-4 font-body-main text-body-main text-text-secondary">TL</span>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar (Contextual FAB replacement for transactional flow) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-border-subtle p-margin-mobile pb-safe z-40 max-w-[390px] mx-auto left-1/2 -translate-x-1/2">
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-title-card text-title-card py-4 rounded-full flex items-center justify-center gap-sm active:scale-[0.98] transition-all shadow-md">
<span>Publish Listing</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</body></html>
